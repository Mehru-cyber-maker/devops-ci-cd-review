   </g>
   <g id="text_4">
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #18354d" transform="translate(348.440944 78.745378)">Input: dependencies</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #18354d" transform="translate(321.870366 91.009761)">Checks known component flaws</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #18354d" transform="translate(318.032015 103.274144)">May miss unknown vulnerabilities</text>
   </g>
   <g id="text_5">
