   <g id="text_2">
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #18354d" transform="translate(81.143056 78.745378)">Input: source code</text>
    <text style="font-size: 9.1px; font-family: 'DejaVu Sans'; fill: #18354d" transform="translate(58.351821 91.009761)">Looks for weakness patterns</text>
